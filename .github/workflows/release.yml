name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  BUILD_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip

      - name: Set up GUI compiler
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check release tag and package version
        if: github.event_name == 'workflow_dispatch'
        shell: python
        run: |
          import os
          import sys

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          import pysar

          tag = os.environ["BUILD_LABEL"]
          expected = f"v{pysar.__version__}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} does not match package version {expected!r}")

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Precompile packaged GUI
        run: node scripts/prepare_packaged_gui.mjs build/packaged_gui

      - name: Build Pysar
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --onefile
          --name Pysar
          --icon resources/logo/pysar.ico
          --add-data "build/packaged_gui;pysar/gui"
          --add-data "resources;resources"
          pysar.py

      - name: Check Windows bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Pysar.exe")) {
            throw "PyInstaller did not create dist/Pysar.exe"
          }

      - name: Package Windows executable
        shell: pwsh
        run: |
          $executable = "Pysar-${{ env.BUILD_LABEL }}-Windows-x64.exe"
          $archive = "Pysar-${{ env.BUILD_LABEL }}-Windows-x64.zip"
          $bundle = "dist/Pysar-Windows-x64"
          New-Item -ItemType Directory -Path $bundle | Out-Null
          Move-Item "dist/Pysar.exe" "$bundle/$executable"
          Copy-Item "LICENSE" "$bundle/LICENSE"
          Copy-Item "third_party_licenses" "$bundle/third_party_licenses" -Recurse
          Compress-Archive -Path "$bundle/*" -DestinationPath $archive

      - name: Upload Windows archive
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: Pysar-*-Windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip

      - name: Set up GUI compiler
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check release tag and package version
        if: github.event_name == 'workflow_dispatch'
        shell: python
        run: |
          import os
          import sys

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          import pysar

          tag = os.environ["BUILD_LABEL"]
          expected = f"v{pysar.__version__}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} does not match package version {expected!r}")

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Precompile packaged GUI
        run: node scripts/prepare_packaged_gui.mjs build/packaged_gui

      - name: Build Pysar
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --onefile
          --name Pysar
          --add-data "build/packaged_gui:pysar/gui"
          --add-data "resources:resources"
          pysar.py

      - name: Check Linux bundle
        run: test -x dist/Pysar

      - name: Package Linux bundle
        run: |
          mkdir -p dist/Pysar-Linux-x64
          mv dist/Pysar dist/Pysar-Linux-x64/Pysar
          cp LICENSE dist/Pysar-Linux-x64/LICENSE
          cp -R third_party_licenses dist/Pysar-Linux-x64/third_party_licenses
          tar -czf "Pysar-${{ env.BUILD_LABEL }}-Linux-x64.tar.gz" -C dist/Pysar-Linux-x64 .

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: Pysar-*-Linux-x64.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    name: Publish GitHub release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum Pysar-* > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BUILD_LABEL }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Pysar-*.zip
            release-assets/Pysar-*.tar.gz
            release-assets/SHA256SUMS.txt
