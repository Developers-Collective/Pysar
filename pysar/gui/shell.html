<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PYSAR - 1.0.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="./" />
<style>
  html, body, #root { height: 100%; margin: 0; background: #0e1013; }
</style>

<script>
  window.PYSAR_NATIVE_CHROME = true;
  window.PYSAR_APP = { name: "PYSAR - 1.0.0", version: "1.0.0", displayVersion: "1.0.0", phase: "Stable" };
  window.PYSAR_DATA = { archive: null, sounds: [], banks: [], groups: [], players: [], waveArchives: [], files: [] };

  window.pysar = {
    ready: new Promise((resolve) => {
      window.addEventListener("pywebviewready", () => resolve(window.pywebview.api));
    }),
    async call(method, ...args) {
      const api = await window.pysar.ready;
      if (typeof api[method] !== "function") {
        throw new Error("PYSAR API has no method: " + method);
      }
      return api[method](...args);
    },
    on(eventType, handler) {
      window.addEventListener("pysar-event", (e) => {
        if (e.detail && e.detail.type === eventType) handler(e.detail.payload);
      });
    },
  };
</script>

<link rel="stylesheet" href="styles.css" />
</head>
